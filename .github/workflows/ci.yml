name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: go vet ./...
      - run: go test -race ./...

      - run: pnpm --dir web check
      - run: pnpm --dir web test

      # Both artifacts the release and the deploy expect to exist.
      - run: pnpm --dir web build
      - run: pnpm --dir docs build
      - run: go build -tags web -o tstamps-server ./cmd/tstamps-server
      - run: go build -o tstamps ./cmd/tstamps

      # One smoke walk of login, logging, reporting and CSV against the built server.
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - run: pnpm --dir web e2e
