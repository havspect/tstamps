    <noscript>
      <header>
        <h1>Tstamps — self-hosted team time tracking</h1>
        <p>
          Tstamps is time tracking for small teams where the plan and the log live in one place. Leads
          plan how many hours each person will spend on each project, week by week, against their
          capacity. People drag entries on a timeline. Reports show the hours logged against the plan,
          every role gets their own My hours chart, and an agent can propose entries through MCP. Run it
          yourself as one AGPL-3.0 Go binary with one SQLite database — one company, or several
          companies as separate workspaces — with no per-seat pricing. A hosted version is coming; it is
          not available today.
        </p>
      </header>
      <nav aria-label="Documentation navigation">
        <a href="/docs/">Documentation</a> ·
        <a href="/docs/install-cli">Install the CLI</a> ·
        <a href="/docs/mcp">MCP &amp; AI Agents</a> ·
        <a href="/docs/server">Self-host on Linux</a>
      </nav>
      <section>
        <h2>Plan it. Drag it. Read it.</h2>
        <ul>
          <li><strong>Plan it:</strong> Set hours per person and project, week by week, against capacity. Seed from last month or repeat a week. Over capacity is marked, not blocked.</li>
          <li><strong>Drag it:</strong> Drag on a lane to log; drag an edge to retime; press space to start and stop.</li>
          <li><strong>Read it:</strong> Projects as rows, days, weeks or months as columns, with the hours logged against the plan. Drill down by person, export CSV. My hours gives everyone their own chart.</li>
          <li><strong>Or let your agent log it:</strong> MCP over stdio or remote with OAuth 2.1. The shipped skill proposes entries and writes only after you confirm.</li>
          <li><strong>One binary, one SQLite database:</strong> Deploy on a single VM under systemd with zero per-seat fees.</li>
        </ul>
      </section>
    </noscript>
