  <body>
    <noscript>
      <h1>Tstamps — self-hosted or hosted team time tracking</h1>
      <p>
        Tstamps is time tracking for small teams, built around a timeline: drag on a lane to log an
        entry, drag its edges to retime it, and read every team's hours by person and by day, week or
        month. The CLI and an MCP server share the same API, so a terminal or an agent can log time
        too. Run it yourself as one AGPL-3.0 Go binary with one SQLite database — one company,
        or several companies as separate workspaces — with no per-seat pricing. A hosted version is
        coming; it is not available today.
      </p>
