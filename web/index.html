    <noscript>
      <header>
        <h1>Tstamps — self-hosted or hosted team time tracking</h1>
        <p>
          Tstamps is time tracking for small teams, built around a timeline: drag on a lane to log an
          entry, drag its edges to retime it, and read every team's hours by person and by day, week or
          month. The CLI and an MCP server share the same API, so a terminal or an agent can log time
          too. Run it yourself as one AGPL-3.0 Go binary with one SQLite database — one company,
          or several companies as separate workspaces — with no per-seat pricing. A hosted version is
          coming; it is not available today.
        </p>
      </header>
      <nav aria-label="Documentation navigation">

        <a href="/docs/server">Self-host on Linux</a>
      </nav>
      <section>
        <h2>Three moves, no timesheet</h2>
        <ul>
          <li><strong>Drag, don't fill in:</strong> Drag on a lane to log; drag an edge to retime; press space to start and stop.</li>
          <li><strong>Read the week:</strong> Projects as rows, days as columns, biggest first. Drill down by person, export CSV.</li>
          <li><strong>Log from the CLI or an agent:</strong> Same token, same REST API, Claude and Codex skills included.</li>
          <li><strong>One binary, one SQLite database:</strong> Deploy on a single VM under systemd with zero per-seat fees.</li>
        </ul>
      </section>
